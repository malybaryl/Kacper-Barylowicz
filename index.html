<!DOCTYPE html>
<html lang="pl" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kacper Baryłowicz</title>
    <link rel="icon" href="static/img/light_logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="./static/css/style.css"/>
    <link rel="stylesheet" href="./static/css/home.css"/>
  </head>
  <body class="font-normal">

    <!-- Navbar/Header -->
    <nav class="navbar navbar-expand-lg border-bottom" data-bs-theme="light">
    <div class="container-fluid px-3 d-flex align-items-center justify-content-between w-100">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img id="logo-img" src="./static/img/light_logo.svg" alt="Logo" width="28" height="28" />
        <span class="fw-semibold">Kacper Barylowicz</span>
      </a>
      <div id="mainNavbar" class="d-flex align-items-center flex-grow-1 justify-content-end"></div>

    </div>
  </nav>

    <!-- Hero/Home -->
    <section class="bg-light dark:bg-dark text-center pb-0 home">
      <div class="container py-5">
        <img id="profile-img" src="static/img/me.jpg" alt="Kacper Baryłowicz" class="rounded-circle shadow-lg mb-4"/>
        <h1 id="greeting" class="display-5 fw-bold mb-1"></h1>
        <p id="quotes" class="lead text-muted mb-3"><p class="quote">"Inwestowanie w wiedzę, zawsze przynosi największe zyski."</p> <p class="author">~ Benjamin Franklin</p></p>
      </div>
    </section>
    
    <!-- About -->
    <section id="about" class="bg-body"></section>
    
    <!-- Education -->
    <section id="education"></section>

    <!-- Experience -->
    <section id="experience" class="bg-body"></section>

    <!-- Skills -->
    <section id="skills"></section>

    <!-- Projects -->
    <section id="projects" class="bg-body"></section>

    <!-- Certificates -->
    <section id="certificates"></section>

    <!-- Contact -->
    <section id="contact" class="bg-body"></section>
    
    <!-- Footer -->
    <footer class="bg-body">
      <div class="container">
        &copy; 2025 Kacper Baryłowicz. All rights reserved.
      </div>
    </footer>
    
    <!-- Bootstrap JS + dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Motyw/Font-size JS -->
    <script type="module" src="static/js/Main.js"></script>
    <script>  
      // Certyfikaty fullscreen view
const fullscreenView = document.getElementById('fullscreen-view');
const fullscreenImg = document.getElementById('fullscreen-image');
document.querySelectorAll('.certificate img.certificate').forEach(img => {
  img.style.cursor = "zoom-in";
  img.addEventListener('click', function(e) {
    e.stopPropagation();
    fullscreenImg.src = this.src;
    fullscreenView.style.display = "flex";
    fullscreenImg.style.display = "block";
  });
});
fullscreenView.addEventListener('click', function() {
  fullscreenView.style.display = "none";
  fullscreenImg.src = ""; 
  fullscreenImg.style.display = "none";
});

    </script>


    </script>
  </body>
</html>
